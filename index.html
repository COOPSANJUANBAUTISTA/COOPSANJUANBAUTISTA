<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Cooperativa San Juan Bautista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-[#d97706] via-[#c2410c] to-[#78350f] min-h-screen text-white flex items-center justify-center p-4 md:p-8">

    <div class="absolute top-0 left-0 w-96 h-96 bg-amber-400/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-orange-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative w-full max-w-6xl bg-black/25 backdrop-blur-xl border border-white/15 rounded-3xl shadow-2xl p-6 md:p-10 flex flex-col justify-between">

        <header class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-amber-500/30 flex items-center justify-center border border-amber-400/50 shadow-inner text-xl">
                    🌱
                </div>
                <div>
                    <h1 id="brand-name" class="text-sm font-bold tracking-wider uppercase text-amber-200"></h1>
                    <p id="brand-location" class="text-xs text-amber-100/70"></p>
                </div>
            </div>

            <nav class="bg-black/30 backdrop-blur-md border border-white/10 px-6 py-2.5 rounded-full flex items-center gap-5 md:gap-8 shadow-lg text-sm font-medium">
                <a href="#inicio" class="text-white hover:text-amber-300 transition-colors">Inicio</a>
                <a href="#fruteria" class="text-white/80 hover:text-amber-300 transition-colors">Frutería</a>
                <a href="#verduras" class="text-white/80 hover:text-amber-300 transition-colors">Verduras</a>
                <a href="#charcuteria" class="text-white/80 hover:text-amber-300 transition-colors">Charcutería</a>
            </nav>

            <div class="hidden md:flex items-center gap-3 text-white/80 text-sm">
                <span class="cursor-pointer hover:text-white transition">🛒 Pedidos</span>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center my-4">
            
            <div class="lg:col-span-5 space-y-6">
                <div id="hero-badge" class="inline-block px-3 py-1 bg-amber-500/20 border border-amber-400/30 rounded-full text-xs font-semibold text-amber-300 tracking-wide"></div>
                <h2 id="hero-title" class="text-4xl md:text-5xl font-extrabold tracking-tight leading-tight"></h2>
                <p id="hero-description" class="text-white/80 text-sm md:text-base leading-relaxed"></p>
                <div class="pt-2">
                    <a href="#catalogo" id="hero-btn" class="inline-flex items-center gap-2 bg-white text-orange-950 font-semibold px-6 py-3.5 rounded-full shadow-lg hover:bg-amber-100 hover:scale-105 transition-all duration-300"></a>
                </div>
            </div>

            <div class="lg:col-span-4 flex justify-center relative py-6">
                <div class="absolute inset-0 bg-gradient-to-t from-amber-500/30 to-transparent rounded-full blur-2xl"></div>
                
                <div class="relative z-10 animate-float bg-black/40 backdrop-blur-md border border-white/20 p-8 rounded-3xl shadow-2xl text-center max-w-xs w-full">
                    <div class="text-7xl mb-3 drop-shadow-xl select-none">🥕🍇🧀</div>
                    <h3 id="center-title" class="font-bold text-lg text-amber-200"></h3>
                    <p id="center-subtitle" class="text-xs text-white/70 mt-1"></p>
                    
                    <div id="center-badge" class="absolute -top-3 -right-3 bg-amber-400 text-orange-950 text-xs font-bold px-3 py-1 rounded-full shadow-lg border border-amber-200"></div>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-4">
                
                <div class="bg-white/10 backdrop-blur-md border border-white/15 p-4 rounded-2xl hover:bg-white/20 transition-all cursor-pointer group shadow-md">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">🥦</span>
                            <div>
                                <h4 id="card1-title" class="font-semibold text-sm group-hover:text-amber-300 transition-colors"></h4>
                                <p id="card1-desc" class="text-xs text-white/70"></p>
                            </div>
                        </div>
                        <div class="w-6 h-6 rounded-full border border-white/30 flex items-center justify-center group-hover:border-amber-300">
                            <div class="w-2 h-2 rounded-full bg-white group-hover:bg-amber-300"></div>
                        </div>
                    </div>
                </div>

                <div class="bg-white/10 backdrop-blur-md border border-white/15 p-4 rounded-2xl hover:bg-white/20 transition-all cursor-pointer group shadow-md">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">🍎</span>
                            <div>
                                <h4 id="card2-title" class="font-semibold text-sm group-hover:text-amber-300 transition-colors"></h4>
                                <p id="card2-desc" class="text-xs text-white/70"></p>
                            </div>
                        </div>
                        <div class="w-6 h-6 rounded-full border border-white/30 flex items-center justify-center group-hover:border-amber-300">
                            <div class="w-2 h-2 rounded-full bg-white group-hover:bg-amber-300"></div>
                        </div>
                    </div>
                </div>

                <div class="bg-white/10 backdrop-blur-md border border-white/15 p-4 rounded-2xl hover:bg-white/20 transition-all cursor-pointer group shadow-md">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">🧀</span>
                            <div>
                                <h4 id="card3-title" class="font-semibold text-sm group-hover:text-amber-300 transition-colors"></h4>
                                <p id="card3-desc" class="text-xs text-white/70"></p>
                            </div>
                        </div>
                        <div class="w-6 h-6 rounded-full border border-white/30 flex items-center justify-center group-hover:border-amber-300">
                            <div class="w-2 h-2 rounded-full bg-white group-hover:bg-amber-300"></div>
                        </div>
                    </div>
                </div>

            </div>

        </main>

        <footer class="mt-8 pt-6 border-t border-white/10 flex flex-col md:flex-row items-center justify-between text-xs text-white/70 gap-4">
            <div>
                <p id="footer-slogan"></p>
            </div>
            
            <div class="flex items-center gap-6">
                <span id="footer-rif" class="text-amber-200"></span>
                <span id="footer-location"></span>
            </div>

            <div class="flex items-center gap-2 bg-black/40 px-4 py-2 rounded-xl border border-white/10 shadow-inner">
                <span class="text-lg">⚖️</span>
                <div>
                    <span id="price-indicator" class="font-bold text-amber-300 text-sm"></span>
                    <p class="text-[10px] text-white/60">Actualizado hoy</p>
                </div>
            </div>
        </footer>

    </div>

    <script src="data.js"></script>
</body>
</html>
